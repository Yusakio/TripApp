<script>
  // ================= 坐标转换（WGS84 -> GCJ02） =================
  function outOfChina(lat, lng){ return (lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271); }
  function transformLat(x, y){
    let ret = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
    ret += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI)) * 2.0/3.0;
    ret += (20.0*Math.sin(y*Math.PI) + 40.0*Math.sin(y/3.0*Math.PI)) * 2.0/3.0;
    ret += (160.0*Math.sin(y/12.0*Math.PI) + 320.0*Math.sin(y*Math.PI/30.0)) * 2.0/3.0;
    return ret;
  }
  function transformLng(x, y){
    let ret = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
    ret += (20.0*Math.sin(6.0*x*Math.PI) + 20.0*Math.sin(2.0*x*Math.PI)) * 2.0/3.0;
    ret += (20.0*Math.sin(x*Math.PI) + 40.0*Math.sin(x/3.0*Math.PI)) * 2.0/3.0;
    ret += (150.0*Math.sin(x/12.0*Math.PI) + 300.0*Math.sin(x/30.0*Math.PI)) * 2.0/3.0;
    return ret;
  }
  function wgs2gcj(lat, lng){
    if (outOfChina(lat, lng)) { return [lat, lng]; }
    let dLat = transformLat(lng - 105.0, lat - 35.0);
    let dLng = transformLng(lng - 105.0, lat - 35.0);
    const radLat = lat / 180.0 * Math.PI;
    let magic = Math.sin(radLat);
    magic = 1 - 0.00669342162296594323 * magic * magic;
    const sqrtMagic = Math.sqrt(magic);
    dLat = (dLat * 180.0) / ((6378245.0 * (1 - 0.00669342162296594323)) / (magic * sqrtMagic) * Math.PI);
    dLng = (dLng * 180.0) / (6378245.0 / sqrtMagic * Math.cos(radLat) * Math.PI);
    return [lat + dLat, lng + dLng];
  }

  const ROUTE = ROUTE_WGS.map(function(p){ return wgs2gcj(p[0], p[1]); });

  // ================= 地图 =================
  let map = null, terrainLayer = null, terrainOn = false;
  const markerMap = {};

  function initMap() {
    if (typeof L === 'undefined') {

    map = L.map('map', { attributionControl:false });
    L.tileLayer('https://webrd0{s}.is.autonavi.com/appmaptile?lang=zh_cn&size=1&scale=1&style=8&x={x}&y={y}&z={z}', {
      subdomains:'1234', maxZoom:18
    }).addTo(map);

    const latlngs = ROUTE.map(function(p){ return [p[0], p[1]]; });
    L.polyline(latlngs, { color:'#ffffff', weight:9, opacity:0.9 }).addTo(map);
    L.polyline(latlngs, { color:'#1d73e8', weight:5, opacity:0.9 }).addTo(map);

    SITES.forEach(function(s, i){
      const color = s.needBook ? '#e74c3c' : '#1d73e8';
      const icon = L.divIcon({
        className:'',
        html:'<div style="width:24px;height:24px;border-radius:50%;background:'+color+';color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:2px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.35);">'+(i+1)+'</div>',
        iconSize:[24,24], iconAnchor:[12,12], popupAnchor:[0,-12]
      });
      const m = L.marker([s.gLat, s.gLng], { icon:icon }).addTo(map);
      m.bindPopup(sitePopupHtml(s), { closeButton:false, maxWidth:320 });
      markerMap[s.id] = m;
    });

    map.fitBounds(L.latLngBounds(latlngs), { padding:[30,30] });
  }

  function setTerrain(on){
    terrainOn = on;
    if (on) {
      if (!terrainLayer) {
        terrainLayer = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', { subdomains:'abc', maxZoom:17 });
      }
      terrainLayer.addTo(map);
    } else if (terrainLayer) {
      map.removeLayer(terrainLayer);
    }
    renderElevation();
  }

  // ================= 弹窗 =================
  function sitePopupHtml(s){
    const tag = s.needBook ? '<span class="tag" style="color:#e74c3c;background:#fdecea;">需预约</span>' : '';
    let book = s.bookUrl ? '<button class="nav-btn book" onclick="bookSite(\'' + s.id + '\')">官网订票</button>' : '';
    let mini = s.mini ? '<div class="mini">小程序：' + s.mini + '<span class="copy" onclick="copyMini(\'' + s.id + '\')">复制名称</span></div>' : '';
    return '<div class="pop">' +
      '<div class="pn">' + s.name + tag + '</div>' +
      '<div class="row"><b>开放</b>　' + s.open + '</div>' +
      '<div class="row"><b>门票</b>　' + s.ticket + '</div>' +
      '<div class="row warn"><b>预约</b>　' + s.booking + '</div>' +
      book + mini +
      '<button class="nav-btn" onclick="openNav(\'' + s.id + '\')">导航去这里</button>' +
    '</div>';
  }
  function dayPopupHtml(d){
    return '<div class="pop">' +
      '<div class="pn">D' + d.n + ' · ' + d.name + '</div>' +
      '<div class="row">' + d.title + '</div>' +
      '<div class="row"><b>车程</b>　' + d.dist + '</div>' +
      '<div class="row"><b>住宿</b>　' + d.stay + '</div>' +
      '<div class="row"><b>摄影</b>　' + d.photo + '</div>' +
      '<div class="row warn"><b>提醒</b>　' + d.tip + '</div>' +
      '<button class="nav-btn" onclick="openNavDay(' + d.n + ')">导航去这里</button>' +
    '</div>';
  }

  // ================= 订票 =================
  function bookSite(id){
    const s = SITES.find(function(x){ return x.id === id; });
    if (!s) return;
    if (s.bookUrl) { window.open(s.bookUrl, '_blank'); }
    else { toast('请通过「' + s.booking + '」办理'); }
  }
  function copyMini(id){
    const s = SITES.find(function(x){ return x.id === id; });
    if (!s || !s.mini) return;
    copyText(s.mini);
    toast('已复制「' + s.mini + '」，去微信搜索即可');
  }
  function copyText(text){
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function(){ fallbackCopy(text); });
    } else { fallbackCopy(text); }
  }
  function fallbackCopy(text){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); } catch(_) {}
    document.body.removeChild(ta);
  }

  // ================= 导航 =================
  let pendingNav = null;
  function openNav(id){ const s = SITES.find(function(x){ return x.id === id; }); if (!s) return; pendingNav = { name:s.name, lat:s.gLat, lng:s.gLng }; showNavSheet(pendingNav); }
  function openNavDay(n){ const d = DAYS.find(function(x){ return x.n === n; }); if (!d) return; pendingNav = { name:d.name, lat:d.gLat, lng:d.gLng }; showNavSheet(pendingNav); }
  function navSchemes(n){
    const nm = encodeURIComponent(n.name);
    return {
      baidu: 'baidumap://map/direction?destination=latlng:' + n.lat + ',' + n.lng + '|name:' + nm + '&mode=driving&coord_type=gcj02&src=tripapp',
      apple: 'maps://?daddr=' + n.lat + ',' + n.lng + '&dirflg=d',
      amap: 'iosamap://navi?sourceApplication=tripapp&poiname=' + nm + '&lat=' + n.lat + '&lon=' + n.lng + '&dev=0'
    };
  }
  function showNavSheet(n){
    document.getElementById('nsName').textContent = n.name;
    const sc = navSchemes(n);
    document.getElementById('nBaidu').setAttribute('href', sc.baidu);
    document.getElementById('nApple').setAttribute('href', sc.apple);
    document.getElementById('nAmap').setAttribute('href', sc.amap);
    document.getElementById('navMask').className = 'show';
    document.getElementById('navSheet').className = 'show';
  }
  function closeNav(){
    document.getElementById('navMask').className = '';
    document.getElementById('navSheet').className = '';
  }
  function goWeb(){
    const n = pendingNav; if (!n) return;
    closeNav();
    const web = 'https://api.map.baidu.com/direction?destination=latlng:' + n.lat + ',' + n.lng + '|name:' + encodeURIComponent(n.name) + '&mode=driving&coord_type=gcj02&output=html&src=tripapp';
    window.open(web, '_blank');
  }

  // ================= 底部功能切换 =================
  let mode = 'itinerary';
  let listTab = 'days';

  function switchMode(m){
    mode = m;
    const tabs = document.querySelectorAll('#tabbar .tab');
    tabs.forEach(function(t){ t.classList.toggle('active', t.getAttribute('data-mode') === m); });
    const sheet = document.getElementById('sheet');
    if (m === 'map') {
      sheet.style.height = '36px';  // 收起
    } else {
      sheet.style.height = Math.round(window.innerHeight * 0.52) + 'px';
      renderSheetBody();
    }
  }
  function renderSheetBody(){
    const el = document.getElementById('sheetBody');
    if (mode === 'itinerary') { el.innerHTML = itineraryHtml(); renderList(); }
    else if (mode === 'elevation') { el.innerHTML = elevationHtml(); }
    else if (mode === 'weather') { el.innerHTML = weatherHtml(); }
  }
  function itineraryHtml(){
    return '<div id="tabs">' +
      '<button id="tabDays" class="' + (listTab === 'days' ? 'active' : '') + '" onclick="switchListTab(\'days\')">行程 9 天</button>' +
      '<button id="tabSites" class="' + (listTab === 'sites' ? 'active' : '') + '" onclick="switchListTab(\'sites\')">景点 14 处</button>' +
      '</div><div id="list"></div>';
  }
  function switchListTab(t){
    listTab = t;
    renderList();
  }
  function renderList(){
    const el = document.getElementById('list');
    if (!el) return;
    const t1 = document.getElementById('tabDays'), t2 = document.getElementById('tabSites');
    if (t1) t1.className = listTab === 'days' ? 'active' : '';
    if (t2) t2.className = listTab === 'sites' ? 'active' : '';
    if (listTab === 'days') {
      el.innerHTML = DAYS.map(function(d){
        return '<div class="item" onclick="focusDay(' + d.n + ')">' +
          '<div class="badge blue">' + d.n + '</div>' +
          '<div class="info"><div class="t">D' + d.n + ' · ' + d.name + '</div>' +
          '<div class="d">' + d.title + '（' + d.dist + '）</div></div></div>';
      }).join('');
    } else {
      el.innerHTML = SITES.map(function(s, i){
        return '<div class="item" onclick="focusSite(\'' + s.id + '\')">' +
          '<div class="badge ' + (s.needBook ? 'red' : 'blue') + '">' + (i+1) + '</div>' +
          '<div class="info"><div class="t">' + s.name + (s.needBook ? '<span class="need">需预约</span>' : '') + '</div>' +
          '<div class="d">' + s.open + ' · ' + s.ticket + '</div></div></div>';
      }).join('');
    }
    el.scrollTop = 0;
  }

  function focusSite(id){
    const s = SITES.find(function(x){ return x.id === id; });
    if (!map || !s) return;
    map.setView([s.gLat, s.gLng], 12);
    setTimeout(function(){ if (markerMap[id]) { markerMap[id].openPopup(); } }, 280);
  }
  function focusDay(n){
    const d = DAYS.find(function(x){ return x.n === n; });
    if (!map || !d) return;
    map.setView([d.gLat, d.gLng], 11);
    L.popup().setLatLng([d.gLat, d.gLng]).setContent(dayPopupHtml(d)).openOn(map);
  }

  // ================= 海拔 =================
  function elevationHtml(){
    return '<div class="panel">' +
      '<h3>海拔地图</h3>' +
      '<div class="seg"><button class="' + (terrainOn ? '' : 'active') + '" onclick="setTerrain(false)">普通地图</button>' +
      '<button class="' + (terrainOn ? 'active' : '') + '" onclick="setTerrain(true)">地形等高线</button></div>' +
      '<h3>实时海拔</h3>' +
      '<button class="big-btn" onclick="getMyElevation()">获取我的位置海拔</button>' +
      '<div class="elev-val" id="myElev">—</div>' +
      '<div class="elev-sub" id="myElevSub">点击上方按钮，定位后显示当前海拔</div>' +
      '<h3>沿途景点海拔</h3>' +
      '<table class="elev-table">' +
      SITES.map(function(s){ return '<tr><td>' + s.name + '</td><td>约 ' + s.ele + ' m</td></tr>'; }).join('') +
      '</table></div>';
  }
  function getMyElevation(){
    if (!navigator.geolocation) { toast('当前环境不支持定位'); return; }
    document.getElementById('myElevSub').textContent = '定位中…';
    navigator.geolocation.getCurrentPosition(function(pos){
      const lat = pos.coords.latitude, lng = pos.coords.longitude;
      fetch('https://api.open-meteo.com/v1/elevation?latitude=' + lat + '&longitude=' + lng)
        .then(function(r){ return r.json(); })
        .then(function(d){
          const e = d && d.elevation && d.elevation[0];
          document.getElementById('myElev').textContent = e != null ? Math.round(e) + ' m' : '—';
          document.getElementById('myElevSub').textContent = '坐标 ' + lat.toFixed(4) + ', ' + lng.toFixed(4);
        })
        .catch(function(){ document.getElementById('myElevSub').textContent = '获取失败，请检查网络'; });
    }, function(){
      document.getElementById('myElevSub').textContent = '定位失败，请检查定位权限';
    }, { enableHighAccuracy:true, timeout:8000 });
  }

  // ================= 天气 =================
  function wmoText(code){
    const c = code | 0;
    if (c === 0) return '晴';
    if (c === 1) return '基本晴';
    if (c === 2) return '多云';
    if (c === 3) return '阴';
    if (c === 45 || c === 48) return '雾';
    if (c >= 51 && c <= 57) return '毛毛雨';
    if (c >= 61 && c <= 67) return '雨';
    if (c >= 71 && c <= 77) return '雪';
    if (c >= 80 && c <= 82) return '阵雨';
    if (c === 85 || c === 86) return '阵雪';
    if (c === 95) return '雷暴';
    if (c === 96 || c === 99) return '雷暴冰雹';
    return '—';
  }
  function weatherHtml(){
    return '<div class="panel">' +
      '<h3>查看天气</h3>' +
      '<button class="big-btn" onclick="getMyWeather()">定位 · 查看当前位置天气</button>' +
      '<div style="font-size:12px;color:#889;margin:2px 0 8px;">或选择沿途景点查看天气：</div>' +
      '<div class="chips" id="weatherChips">' +
      SITES.map(function(s, i){ return '<span data-i="' + i + '" onclick="getSiteWeather(' + i + ')">' + s.name + '</span>'; }).join('') +
      '</div>' +
      '<div id="weatherResult"></div>' +
      '</div>';
  }
  function getMyWeather(){
    if (!navigator.geolocation) { toast('当前环境不支持定位'); return; }
    setWeatherLoading('定位中…');
    navigator.geolocation.getCurrentPosition(function(pos){
      fetchWeather(pos.coords.latitude, pos.coords.longitude, '当前位置');
    }, function(){ setWeatherResult('定位失败，请检查定位权限'); }, { enableHighAccuracy:true, timeout:8000 });
  }
  function getSiteWeather(i){
    const s = SITES[i];
    document.querySelectorAll('#weatherChips span').forEach(function(x, j){ x.classList.toggle('active', j === i); });
    setWeatherLoading('查询「' + s.name + '」天气…');
    fetchWeather(s.lat, s.lng, s.name);
  }
  function fetchWeather(lat, lng, label){
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lng +
      '&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=4';
    fetch(url).then(function(r){ return r.json(); }).then(function(d){
      renderWeather(d, label);
    }).catch(function(){ setWeatherResult('获取失败，请检查网络'); });
  }
  function setWeatherLoading(t){ document.getElementById('weatherResult').innerHTML = '<div style="text-align:center;color:#889;padding:20px;">' + t + '</div>'; }
  function setWeatherResult(t){ document.getElementById('weatherResult').innerHTML = '<div style="text-align:center;color:#889;padding:20px;">' + t + '</div>'; }
  function renderWeather(d, label){
    const cur = d.current, daily = d.daily;
    let html = '<div class="wcard">' +
      '<div style="font-size:13px;color:#445;margin-bottom:6px;">' + label + ' · 当前</div>' +
      '<div class="wmain"><div class="wt">' + Math.round(cur.temperature_2m) + '°</div>' +
      '<div class="wd">' + wmoText(cur.weather_code) + '<small>体感 ' + Math.round(cur.apparent_temperature) + '°</small></div></div>' +
      '<div class="wrow"><span>湿度 ' + cur.relative_humidity_2m + '%</span><span>风速 ' + cur.wind_speed_10m + ' km/h</span></div>' +
      '</div>';
    const names = ['今天', '明天', '后天', '3天后'];
    html += '<div class="wcard"><div style="font-size:13px;color:#445;margin-bottom:6px;">未来几天</div>';
    for (let i = 0; i < daily.time.length && i < 4; i++) {
      html += '<div class="wday"><span>' + names[i] + ' <span style="color:#99a;font-size:11px;">' + daily.time[i] + '</span></span>' +
        '<span>' + wmoText(daily.weather_code[i]) + ' · <b>' + Math.round(daily.temperature_2m_max[i]) + '°</b> / ' + Math.round(daily.temperature_2m_min[i]) + '°</span></div>';
    }
    html += '</div>';
    document.getElementById('weatherResult').innerHTML = html;
  }

  // ================= 底部面板拖拽 =================
  function sheetEl(){ return document.getElementById('sheet'); }
  function snapHeights(){
    const vh = window.innerHeight;
    return [36, Math.round(vh * 0.52), Math.round(vh * 0.76)];
  }
  (function(){
    const handleEl = document.getElementById('handle');
    let drag = null;
    handleEl.addEventListener('pointerdown', function(e){
      drag = { startY: e.clientY, startH: sheetEl().getBoundingClientRect().height };
      sheetEl().classList.add('no-anim');
      try { handleEl.setPointerCapture(e.pointerId); } catch(_) {}
    });
    handleEl.addEventListener('pointermove', function(e){
      if (!drag) return;
      e.preventDefault();
      const snaps = snapHeights();
      let h = drag.startH + (drag.startY - e.clientY);
      h = Math.max(snaps[0], Math.min(snaps[2], h));
      sheetEl().style.height = h + 'px';
    });
    handleEl.addEventListener('pointerup', function(e){
      if (!drag) return;
      const snaps = snapHeights();
      const dy = drag.startY - e.clientY;
      const cur = sheetEl().getBoundingClientRect().height;
      let target;
      if (Math.abs(dy) < 6) {
        target = cur > snaps[1] * 0.6 ? snaps[0] : snaps[1];
      } else {
        const cands = dy > 0 ? [snaps[1], snaps[2]] : [snaps[0], snaps[1]];
        target = cands[0];
        let bd = Math.abs(cur - cands[0]);
        for (const s of cands) { const d = Math.abs(cur - s); if (d < bd) { bd = d; target = s; } }
      }
      sheetEl().classList.remove('no-anim');
      sheetEl().style.height = target + 'px';
      drag = null;
    });
    handleEl.addEventListener('pointercancel', function(){
      if (!drag) return;
      drag = null;
      sheetEl().classList.remove('no-anim');
      const snaps = snapHeights();
      const cur = sheetEl().getBoundingClientRect().height;
      let target = snaps[1], bd = Math.abs(cur - snaps[1]);
      for (const s of snaps) { const d = Math.abs(cur - s); if (d < bd) { bd = d; target = s; } }
      sheetEl().style.height = target + 'px';
    });
  })();

  // ================= 提示 =================
  let toastTimer = null;
  function toast(msg){
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'show';
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.className = ''; }, 2000);
  }

  // ================= 启动 =================
  initMap();
  renderSheetBody();
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    });
  }
</script>
</body>
